<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Crime to Say - Karaoke Challenge</title>
  <style>
    body {
      font-family: system-ui, sans-serif;
      max-width: 520px;
      margin: 30px auto;
      padding: 0 16px;
      text-align: center;
      background: #111;
      color: white;
    }
    video {
      width: 100%;
      max-width: 420px;
      border-radius: 14px;
      background: #000;
      transform: scaleX(-1);
    }
    button, a.button {
      background: #e11d48;
      color: white;
      border: none;
      padding: 14px 28px;
      font-size: 17px;
      border-radius: 50px;
      margin: 10px 6px;
      cursor: pointer;
      text-decoration: none;
      display: inline-block;
    }
    button:disabled {
      background: #555;
      cursor: not-allowed;
    }
    #downloadBtn {
      background: #16a34a;
      display: none;
    }
    #status {
      margin: 18px 0;
      font-size: 16px;
      min-height: 24px;
    }
  </style>
</head>
<body>
  <h1>Crime to Say</h1>
  <p>Karaoke Challenge</p>
  <p>Allow camera & microphone, then press Record</p>

  <video id="preview" autoplay muted playsinline></video>

  <div id="status">Ready</div>

  <button id="recordBtn">● Record</button>
  <button id="stopBtn" disabled>Stop</button>
  <br>
  <a id="downloadBtn" class="button">Download Video</a>

  <script>
    const preview = document.getElementById('preview');
    const recordBtn = document.getElementById('recordBtn');
    const stopBtn = document.getElementById('stopBtn');
    const downloadBtn = document.getElementById('downloadBtn');
    const status = document.getElementById('status');

    let mediaRecorder;
    let recordedChunks = [];
    let audioContext;
    let micStream;
    let audioElement;

    // IMPORTANT: use the exact filename of your mp3
    audioElement = new Audio('Crime to Say Oke Challenge.mp3');
    audioElement.crossOrigin = "anonymous";

    async function startCamera() {
      try {
        micStream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: 'user' },
          audio: true
        });
        preview.srcObject = micStream;
      } catch (err) {
        status.textContent = 'Camera/mic error: ' + err.message;
      }
    }

    startCamera();

    recordBtn.onclick = async () => {
      recordedChunks = [];
      status.textContent = 'Starting...';

      try {
        // Resume AudioContext (needed on Safari / Mac)
        audioContext = new (window.AudioContext || window.webkitAudioContext)();
        if (audioContext.state === 'suspended') {
          await audioContext.resume();
        }

        // Music
        const musicSource = audioContext.createMediaElementSource(audioElement);
        const musicGain = audioContext.createGain();
        musicGain.gain.value = 0.75;
        musicSource.connect(musicGain);

        // Microphone
        const micSource = audioContext.createMediaStreamSource(micStream);
        const micGain = audioContext.createGain();
        micGain.gain.value = 1.4;
        micSource.connect(micGain);

        // Mix
        const destination = audioContext.createMediaStreamDestination();
        musicGain.connect(destination);
        micGain.connect(destination);

        // Combined stream (camera video + mixed audio)
        const videoTrack = micStream.getVideoTracks()[0];
        const mixedStream = new MediaStream([
          videoTrack,
          ...destination.stream.getAudioTracks()
        ]);

          mimeType: 'video/webm;codecs=vp9,
