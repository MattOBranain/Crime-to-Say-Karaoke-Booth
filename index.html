<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Insta-Karaoke Booth</title>
    <!-- Load FFmpeg.wasm from CDN -->
    <script src="https://unpkg.com/@ffmpeg/ffmpeg@0.12.7/dist/umd/ffmpeg.js"></script>
    <style>
        body { margin: 0; background: #000; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; color: white; font-family: sans-serif; }
        /* Container to force 9:16 preview on desktop */
        #preview-container {
            position: relative;
            width: 100%;
            max-width: 450px; /* Limits width to simulate mobile */
            aspect-ratio: 9/16;
            background: #111;
            overflow: hidden;
            border: 2px solid #333;
        }
        video, canvas {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transform: scaleX(-1); /* Mirror effect for selfie cam */
        }
        #controls { margin-top: 20px; z-index: 10; }
        button { padding: 15px 30px; font-size: 18px; cursor: pointer; background: #e1306c; color: white; border: none; border-radius: 8px; }
        button:disabled { background: #555; }
        #status { margin-top: 10px; font-size: 14px; color: #aaa; }
        /* Hidden canvas for processing */
        #processing-canvas { display: none; }
    </style>
</head>
<body>

    <div id="preview-container">
        <!-- The user sees this video element -->
        <video id="preview" autoplay playsinline muted></video>
    </div>

    <div id="controls">
        <button id="startBtn">Start Recording</button>
        <button id="stopBtn" disabled>Stop & Convert</button>
    </div>
    <div id="status">Ready</div>

    <!-- Hidden canvas for recording video + lyrics -->
    <canvas id="processing-canvas" width="1080" height="1920"></canvas>

    <script src="app.js"></script>
</body>
</html>
